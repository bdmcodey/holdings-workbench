[pytest]
minversion = 8.0
testpaths = tests

addopts =
    -ra
    --strict-markers
    --strict-config

# A leaked file handle is a real defect and an invisible one: it shows only as
# a ResourceWarning nobody reads, and the route that leaks in a test leaks in
# the application too. Promoted to an error so it cannot be ignored.
#
# Two lines, and the second is the one that works. A file closed by garbage
# collection rather than by the test raises its ResourceWarning outside any
# test's warning context, so pytest reports it wrapped as a
# PytestUnraisableExceptionWarning -- and a filter naming ResourceWarning alone
# never sees it. Reintroducing the leak proved that: the run stayed green with
# "1 warning" beside it. Both are named so either form is an error.
#
# Deliberately these two rather than a blanket `error`. The suite passes under
# the blanket form today, but it would then fail whenever a dependency
# deprecates something on one of the four Python versions CI runs -- a failure
# that says nothing about this code, on a schedule nobody chose.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning

norecursedirs =
    .venv
    .git
    */templates
    */__pycache__

markers =
    calibration: pins exact counts against the private USC corpus; skips cleanly when it is unavailable
